# Experimental ClickHouse storage for a self-hosted hub. Local development only:
# the credentials below are throwaway defaults, and both ports bind to loopback.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - 127.0.0.1:8123:8123
      - 127.0.0.1:9000:9000
    environment:
      CLICKHOUSE_DB: token_tracker
      CLICKHOUSE_USER: token_tracker
      CLICKHOUSE_PASSWORD: token_tracker_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - token-tracker-clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  token-tracker-clickhouse-data:
    name: token-tracker-clickhouse-data
