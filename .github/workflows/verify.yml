name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24.21.0'
          run-install: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format
        run: bun run format
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Typecheck
        run: bun run check
      - name: Test
        run: bun run test
      - name: Build dashboard
        run: bun run build
      - name: Build CLI
        run: bun run build:cli
      - name: Working tree stays clean
        run: git diff --exit-code && git diff --check
