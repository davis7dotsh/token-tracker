# Tag-driven release workflow running entirely on Depot CI.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish portable releases
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: write
    env:
      ImageOS: ubuntu24
      MIX_ENV: prod
    steps:
      - name: Resolve release tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ -n "${DISPATCH_TAG:-}" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if ! printf '%s\n' "$tag" |
            grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.4"
          elixir-version: "1.20.2"
          version-type: strict
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.15.2"
      - name: Restore Mix cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-prod-otp28.4-elixir1.20.2-${{ hashFiles('mix.lock') }}
      - name: Install dependencies and build dashboard
        run: |
          mix deps.get
          mix assets.install
          mix assets.build
      - name: Run tests
        env:
          MIX_ENV: test
        run: mix check
      - name: Build all release targets
        run: ./scripts/package-release.sh "${{ steps.tag.outputs.tag }}" dist
      - name: Smoke-test Linux x86-64 artifact
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          mkdir -p /tmp/token-tracker-smoke
          tar -xzf \
            "dist/token-tracker_${RELEASE_TAG}_linux_x86_64.tar.gz" \
            -C /tmp/token-tracker-smoke
          HOME="$PWD/smoke-home" \
            /tmp/token-tracker-smoke/token-tracker --version |
            grep -q "token-tracker ${RELEASE_TAG#v}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: token-tracker ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/token-tracker_${{ steps.tag.outputs.tag }}_*.tar.gz
            dist/checksums.txt
