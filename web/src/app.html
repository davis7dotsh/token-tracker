<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script src="%sveltekit.assets%/theme.js"></script>
		<style>
			#initial-loading {
				position: fixed;
				inset: 0;
				z-index: 1000;
				display: grid;
				place-content: center;
				gap: 14px;
				background: #f4f3ef;
				color: #181917;
				font:
					500 0.78rem/1 system-ui,
					sans-serif;
				letter-spacing: 0.12em;
			}

			#initial-loading::after {
				width: 100%;
				height: 2px;
				background: #3b3d39;
				content: '';
				animation: initial-loading-pulse 1.2s ease-in-out infinite alternate;
			}

			:root[data-theme='dark'] #initial-loading {
				background: #090a09;
				color: #ecece8;
			}

			:root[data-theme='dark'] #initial-loading::after {
				background: #f4f3ef;
			}

			@keyframes initial-loading-pulse {
				from {
					opacity: 0.25;
					transform: scaleX(0.25);
				}
				to {
					opacity: 1;
					transform: scaleX(1);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				#initial-loading::after {
					animation: none;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="initial-loading" role="status" aria-live="polite">
			<span>LOADING TOKEN/01</span>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
